<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>每日求导 · 每天 5 题</title>
<style>
  :root{
    --ink:#1f2937;
    --muted:#6b7280;
    --paper:#f7f4ec;
    --card:#fffdf9;
    --line:#e8e1d3;
    --accent:#2563eb;
    --accent-soft:#eff6ff;
    --accent-line:#bfdbfe;
    --shadow:0 18px 40px -30px rgba(70,55,25,.55);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);
    line-height:1.6;
    background:
      radial-gradient(900px 520px at 8% -12%, #e4edff 0%, rgba(228,237,255,0) 58%),
      radial-gradient(820px 480px at 100% 0%, #fff1d6 0%, rgba(255,241,214,0) 52%),
      var(--paper);
    -webkit-font-smoothing:antialiased;
  }
  .page{max-width:900px;margin:0 auto;padding:20px 22px 56px}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:4px 0 22px}
  .brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);font-weight:800;font-size:14px;letter-spacing:.01em}
  .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(140deg,#1d4ed8,#3b82f6);color:#fff;display:grid;place-items:center;font-family:"Cambria Math",Georgia,serif;font-size:17px;box-shadow:0 10px 18px -10px rgba(37,99,235,.7)}
  nav{display:flex;gap:6px}
  nav a{font-size:13px;font-weight:700;color:#6b7280;text-decoration:none;padding:7px 12px;border-radius:999px;transition:.2s}
  nav a:hover{background:#fff;color:var(--accent);box-shadow:0 2px 8px rgba(70,55,25,.08)}
  nav a.active{background:#fff;color:var(--accent);box-shadow:0 2px 8px rgba(70,55,25,.08)}

  .hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:4px 0 24px;border-bottom:1px dashed #d9d0bd}
  .kicker{font-size:11px;font-weight:800;letter-spacing:.22em;color:var(--accent)}
  h1{font-size:clamp(36px,6vw,52px);line-height:1.12;margin:8px 0 10px;letter-spacing:-.03em;font-weight:800}
  .hero p{margin:0;color:var(--muted);font-size:13.5px}
  .meta{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:14px;font-size:12.5px;color:#8b8272}
  .meta .sep{width:3px;height:3px;border-radius:50%;background:#c9bfa9}
  .meta b{color:var(--ink);font-variant-numeric:tabular-nums}
  .set-pill{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);padding:2px 8px;border-radius:6px}

  .score{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;min-width:170px;box-shadow:var(--shadow);flex:none}
  .score-num{font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .score-num span{font-size:13px;color:var(--muted);font-weight:600;margin-left:2px}
  .score-label{font-size:11.5px;color:#8b8272;margin-top:5px}
  .progress{height:6px;background:#eee8db;border-radius:99px;overflow:hidden;margin-top:10px}
  .progress i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s ease}
  .level-row{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:11px;color:#8b8272}
  .level-dots{display:flex;gap:3px}
  .level-dots i{display:block;width:12px;height:5px;border-radius:2px;background:#e8e1d3;transition:.25s}
  .level-dots i.on{background:var(--accent)}
  .level-row b{color:var(--ink);font-size:11.5px}

  .list{display:flex;flex-direction:column;gap:16px;margin:24px 0 0}
  .problem{display:flex;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow);transition:border-color .2s,background .2s}
  .problem.correct{border-color:#bbf7d0;background:#f8fefb}
  .problem.wrong{border-color:#fecaca;background:#fffafa}
  .num{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:13.5px;flex:none;font-variant-numeric:tabular-nums}
  .content{flex:1;min-width:0}
  .type{font-size:10.5px;letter-spacing:.12em;font-weight:800;color:#9a8f7a;margin-bottom:5px}
  .q{font-size:16.5px;line-height:2.05}
  .math{font-family:"Cambria Math","STIX Two Math",Georgia,"Times New Roman",serif;font-size:1.07em;white-space:nowrap}
  .math i{font-style:italic}
  .math sup{font-size:.64em}
  .prime{font-family:Georgia,"Times New Roman",serif;font-style:normal;font-weight:700;font-size:1.18em;line-height:0;vertical-align:.2em;padding-left:.03em;color:inherit}

  .input-row{margin-top:12px}
  .ans-input{
    width:100%;font-family:"Cambria Math","STIX Two Math",Georgia,"Times New Roman",serif;
    font-size:16px;color:var(--ink);background:#fff;border:1.5px solid #ddd3c0;border-radius:10px;
    padding:11px 14px;outline:none;transition:border-color .18s, box-shadow .18s;
  }
  .ans-input::placeholder{color:#b8ad98;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:12.5px}
  .ans-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .ans-input:disabled{background:#f8f6f0;color:#6b7280}
  .input-hint{font-size:11px;color:#a89d88;margin-top:5px}

  .feedback{font-size:12.5px;font-weight:700;margin-top:9px;line-height:1.6}
  .feedback.ok{color:#15803d}
  .feedback.warn{color:#b45309}
  .feedback.bad{color:#b91c1c}

  .answer{margin-top:12px;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:12px;padding:12px 15px}
  .answer[hidden]{display:none}
  .answer .head{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--accent);margin-bottom:5px}
  .ans-main{font-size:17px;font-weight:700;line-height:1.95}
  .steps{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
  .steps li{font-size:13px;color:#475569;line-height:1.9;padding-left:12px;position:relative}
  .steps li::before{content:"·";position:absolute;left:0;color:var(--accent);font-weight:800}

  .actions{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0 0}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:10px;border:1px solid #ddd3c0;background:#fff;color:#4b5563;padding:9px 14px;cursor:pointer;transition:.18s}
  .btn:hover{border-color:var(--accent);color:var(--accent);background:#fff}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 10px 18px -12px rgba(37,99,235,.8)}
  .btn.primary:hover{background:#1d4ed8;color:#fff}
  .btn:disabled{opacity:.5;cursor:default;box-shadow:none}
  .btn.next{background:var(--accent);border-color:var(--accent);color:#fff;padding:11px 18px;font-size:13.5px}
  .btn.next:hover{background:#1d4ed8;color:#fff}

  .result-panel{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .result-panel[hidden]{display:none}
  .result-big{font-size:24px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .result-big span{font-size:13px;color:#8b8272;font-weight:600}
  .result-msg{font-size:12.5px;color:#6b7280;margin-top:3px;line-height:1.65}
  .result-msg b{color:var(--accent)}

  footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:30px;padding-top:16px;font-size:12px;color:#9a8f7a}
  footer a{color:var(--accent);text-decoration:none;font-weight:700}
  footer a:hover{text-decoration:underline}

  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:#1f2937;color:#fff;padding:10px 16px;border-radius:10px;font-size:12.5px;opacity:0;pointer-events:none;transition:.25s;z-index:20;box-shadow:0 12px 30px -12px rgba(0,0,0,.5)}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:680px){
    .page{padding:16px 14px 42px}
    .topbar{padding-bottom:16px}
    .hero{flex-direction:column;align-items:stretch;gap:14px;padding-bottom:18px}
    .score{display:flex;align-items:center;gap:12px;padding:10px 14px;min-width:0;flex-wrap:wrap}
    .score-num{font-size:22px}
    .score-label{margin:0}
    .progress{flex:1;margin:0;min-width:60px}
    .level-row{margin:0;width:100%}
    .problem{padding:16px 15px;gap:12px}
    .num{width:32px;height:32px;font-size:12px;border-radius:9px}
    .q{font-size:15.5px;line-height:1.95}
    .ans-main{font-size:15.5px}
    .type{font-size:10px}
  }
  @media print{
    body{background:#fff}
    .topbar,.actions,.score,.meta,.toast,footer,.kicker,.result-panel{display:none!important}
    .page{max-width:none;padding:0}
    .hero{border:none;padding:0 0 12px}
    .problem{box-shadow:none;border:1px solid #ddd;break-inside:avoid;page-break-inside:avoid}
    .answer{background:#fff;border:1px dashed #bbb}
    .list{gap:12px}
  }
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <a class="brand" href="index.html"><span class="logo">∂</span>每日一练</a>
    <nav>
      <a class="active" href="每日求导.html">求导</a>
      <a href="每日微积分.html">微积分</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div>
        <div class="kicker">DAILY DERIVATIVE</div>
        <h1>每日求导</h1>
        <p>每天 5 道 · 三次以下多项式 · 输入答案自动判分</p>
        <div class="meta">
          <span id="today">—</span>
          <span class="sep"></span>
          <span class="set-pill" id="setLabel">今日题目</span>
          <span class="sep"></span>
          <span>距明日更新 <b id="countdown">--:--:--</b></span>
        </div>
      </div>
      <div class="score">
        <div class="score-num"><b id="scoreNum">—</b><span>/ 5</span></div>
        <div class="score-label" id="scoreLabel">提交后判分</div>
        <div class="progress"><i id="bar"></i></div>
        <div class="level-row">
          <span>难度</span>
          <span class="level-dots" id="levelDots"><i></i><i></i><i></i><i></i><i></i></span>
          <b id="levelText">Lv.3</b>
        </div>
      </div>
    </section>

    <section class="list" id="list"></section>

    <div class="actions">
      <button class="btn primary" id="submitBtn">提交答案并判分</button>
      <button class="btn" id="copyBtn">复制题目</button>
      <button class="btn" id="printBtn">打印</button>
    </div>

    <div class="result-panel" id="resultPanel" hidden>
      <div>
        <div class="result-big"><span id="scoreBig">0</span> <span>/ 5 答对</span></div>
        <div class="result-msg" id="resultMsg"></div>
      </div>
      <button class="btn next" id="nextBtn">再来一组 →</button>
    </div>
  </main>

  <footer>
    <a href="每日微积分.html">← 去练微积分</a>
    <span>输入答案后判分 · 根据正确率自动调节难度</span>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  /* ================= 日期与可复现随机 ================= */
  function pad(n){ return String(n).padStart(2, '0'); }
  function dateKey(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function hashStr(s){
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function mulberry32(a){
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function ri(r, a, b){ return a + Math.floor(r() * (b - a + 1)); }
  function nz(r, a, b){ let v = 0; while (v === 0) v = ri(r, a, b); return v; }

  /* ================= 多项式工具 ================= */
  function countNZ(a){ let n = 0; for (const v of a) if (v) n++; return n; }
  function termHtml(c, p){
    if (!c) return '0';
    const a = Math.abs(c);
    let core;
    if (p === 0) core = String(a);
    else core = (a === 1 ? '' : String(a)) + '<i>x</i>' + (p > 1 ? '<sup>' + p + '</sup>' : '');
    return (c < 0 ? '−' : '') + core;
  }
  function polyHtml(coeffs){
    const deg = coeffs.length - 1;
    let out = '', first = true;
    for (let i = 0; i < coeffs.length; i++){
      const c = coeffs[i], p = deg - i;
      if (!c) continue;
      const a = Math.abs(c);
      const sign = c < 0 ? (first ? '−' : ' − ') : (first ? '' : ' + ');
      let core;
      if (p === 0) core = String(a);
      else core = (a === 1 ? '' : String(a)) + '<i>x</i>' + (p > 1 ? '<sup>' + p + '</sup>' : '');
      out += sign + core;
      first = false;
    }
    return out || '0';
  }
  function polyText(coeffs){
    return polyHtml(coeffs)
      .replace(/<i>x<\/i>/g, 'x')
      .replace(/<sup>(\d)<\/sup>/g, function(m, d){ return d === '2' ? '²' : (d === '3' ? '³' : d); });
  }
  function numText(n){ return n < 0 ? '−' + Math.abs(n) : String(n); }
  function derivCoeffs(coeffs){
    const n = coeffs.length - 1, out = [];
    for (let i = 0; i < n; i++) out.push(coeffs[i] * (n - i));
    return out;
  }
  function evalPoly(coeffs, x){
    let v = 0;
    for (let i = 0; i < coeffs.length; i++) v = v * x + coeffs[i];
    return v;
  }

  /* ================= 输入解析与判分 ================= */
  function parsePoly(raw){
    let s = String(raw || '').trim().toLowerCase();
    if (!s) return null;
    s = s.replace(/[−–—]/g, '-').replace(/[＋]/g, '+')
         .replace(/[×·*]/g, '')
         .replace(/²/g, '^2').replace(/³/g, '^3').replace(/⁴/g, '^4')
         .replace(/x([2-9])/g, 'x^$1')
         .replace(/\s+/g, '');
    s = s.replace(/^[a-z]\s*['′]?\s*\(\s*x\s*\)\s*=/i, '');
    s = s.replace(/^[a-z]\s*=/i, '');
    s = s.replace(/^原式\s*=/, '').replace(/^=+/, '');
    s = s.replace(/[+\-]c$/i, '');
    if (!s) return null;
    if (s[0] !== '+' && s[0] !== '-') s = '+' + s;
    s = s.replace(/\+-/g, '-').replace(/--/g, '+');
    const terms = s.match(/[+\-][^+\-]+/g);
    if (!terms) return null;
    const map = {};
    for (const t of terms){
      const sign = t[0] === '-' ? -1 : 1;
      let body = t.slice(1);
      if (!body) return null;
      let m;
      if ((m = body.match(/^(\d*)x\^(\d+)$/))){
        const c = m[1] === '' ? 1 : parseInt(m[1], 10);
        const p = parseInt(m[2], 10);
        if (p > 9) return null;
        map[p] = (map[p] || 0) + sign * c;
      } else if ((m = body.match(/^(\d*)x$/))){
        const c = m[1] === '' ? 1 : parseInt(m[1], 10);
        map[1] = (map[1] || 0) + sign * c;
      } else if ((m = body.match(/^(\d+)$/))){
        map[0] = (map[0] || 0) + sign * parseInt(m[1], 10);
      } else {
        return null;
      }
    }
    let maxDeg = 0;
    Object.keys(map).forEach(function(k){ if (map[k] !== 0 && Number(k) > maxDeg) maxDeg = Number(k); });
    const arr = [];
    for (let p = maxDeg; p >= 0; p--) arr.push(map[p] || 0);
    return arr;
  }
  function parseNumber(raw){
    let s = String(raw || '').trim().replace(/\s+/g, '').replace(/[−–—]/g, '-').replace(/^\+/, '');
    if (!/^-?\d+$/.test(s)) return null;
    return parseInt(s, 10);
  }
  function polyEquals(a, b){
    const max = Math.max(a.length, b.length);
    for (let i = 0; i < max; i++){
      const av = a[a.length - 1 - i] || 0;
      const bv = b[b.length - 1 - i] || 0;
      if (av !== bv) return false;
    }
    return true;
  }

  /* ================= 难度与出题 ================= */
  const LEVELS = [
    { maxC: 3, minTerms: 2, specs: [[1,'d'],[1,'d'],[2,'d'],[2,'d'],[2,'e']] },
    { maxC: 4, minTerms: 2, specs: [[1,'d'],[2,'d'],[2,'d'],[3,'d'],[2,'e']] },
    { maxC: 5, minTerms: 2, specs: [[2,'d'],[2,'d'],[3,'d'],[3,'d'],[2,'e']] },
    { maxC: 6, minTerms: 3, specs: [[2,'d'],[3,'d'],[3,'d'],[3,'d'],[3,'e']] },
    { maxC: 8, minTerms: 3, specs: [[3,'d'],[3,'d'],[3,'d'],[3,'d'],[3,'e']] }
  ];

  function makePoly(r, deg, cfg){
    let coeffs;
    do {
      if (deg === 3) coeffs = [nz(r, -cfg.maxC, cfg.maxC), ri(r, -cfg.maxC, cfg.maxC), ri(r, -cfg.maxC, cfg.maxC), ri(r, -(cfg.maxC + 2), cfg.maxC + 2)];
      else if (deg === 2) coeffs = [nz(r, -cfg.maxC, cfg.maxC), ri(r, -cfg.maxC, cfg.maxC), ri(r, -(cfg.maxC + 1), cfg.maxC + 1)];
      else coeffs = [nz(r, -cfg.maxC, cfg.maxC), ri(r, -(cfg.maxC + 2), cfg.maxC + 2)];
    } while (countNZ(coeffs) < cfg.minTerms);
    return coeffs;
  }

  function derivativeProblem(coeffs, mode, x0){
    const deg = coeffs.length - 1;
    const d = derivCoeffs(coeffs);
    const degName = ['', '一次', '二次', '三次'][deg];
    const isEval = mode === 'eval';

    const qHtml = isEval
      ? '已知 <span class="math"><i>f</i>(<i>x</i>) = ' + polyHtml(coeffs) + '</span>，求 <span class="math"><i>f</i><span class="prime">&#39;</span>(' + numText(x0) + ')</span>。'
      : '已知 <span class="math"><i>f</i>(<i>x</i>) = ' + polyHtml(coeffs) + '</span>，求 <span class="math"><i>f</i><span class="prime">&#39;</span>(<i>x</i>)</span>。';
    const qText = isEval
      ? '已知 f(x) = ' + polyText(coeffs) + '，求 f′(' + numText(x0) + ')。'
      : '已知 f(x) = ' + polyText(coeffs) + '，求 f′(x)。';

    const steps = [];
    for (let i = 0; i < coeffs.length; i++){
      const c = coeffs[i], p = deg - i;
      if (!c) continue;
      const dc = c * p;
      steps.push('<li><span class="math">(' + termHtml(c, p) + ')<span class="prime">&#39;</span> = ' + (dc === 0 ? '0' : termHtml(dc, p - 1)) + '</span></li>');
    }

    let ansHtml = '<div class="ans-main math"><i>f</i><span class="prime">&#39;</span>(<i>x</i>) = ' + polyHtml(d) + '</div>';
    if (isEval){
      const value = evalPoly(d, x0);
      ansHtml += '<div class="ans-main math" style="margin-top:4px"><i>f</i><span class="prime">&#39;</span>(' + numText(x0) + ') = ' + numText(value) + '</div>';
      const vals = [];
      for (let i = 0; i < d.length; i++){
        const p = d.length - 1 - i;
        if (!d[i]) continue;
        vals.push(d[i] * Math.pow(x0, p));
      }
      if (vals.length > 1){
        let expr = '';
        vals.forEach(function(v, i){
          expr += (v < 0 ? (i ? ' − ' : '−') : (i ? ' + ' : '')) + Math.abs(v);
        });
        steps.push('<li><span class="math">代入 <i>x</i> = ' + numText(x0) + '：' + expr + ' = ' + numText(value) + '</span></li>');
      }
    }
    steps.push('<li>逐项求导：<span class="math">(<i>x</i><sup><i>n</i></sup>)<span class="prime">&#39;</span> = <i>n</i><i>x</i><sup><i>n</i>−1</sup></span>，常数项导数为 0。</li>');

    return {
      type: degName + '多项式 · ' + (isEval ? '求导数值' : '求导'),
      question: qHtml,
      plain: qText,
      answer: ansHtml + '<ul class="steps">' + steps.join('') + '</ul>',
      check: isEval ? { kind: 'number', value: evalPoly(d, x0) } : { kind: 'poly', coeffs: d },
      placeholder: isEval ? '例如：17' : '例如：6x^2-6x+5',
      hint: isEval ? '直接填数值，如 17' : '用 ^ 表示乘方，如 x^3；常数直接写数字'
    };
  }

  function buildSet(seed, level){
    const cfg = LEVELS[level - 1];
    const r = mulberry32(seed);
    const probs = [];
    const used = new Set();
    cfg.specs.forEach(function(spec){
      const deg = spec[0], mode = spec[1];
      let coeffs, x0 = null, sig, tries = 0;
      do {
        coeffs = makePoly(r, deg, cfg);
        if (mode === 'e') x0 = ri(r, -2, 3);
        sig = mode + coeffs.join(',') + (x0 !== null ? '|' + x0 : '');
        tries++;
      } while (used.has(sig) && tries < 100);
      used.add(sig);
      probs.push(derivativeProblem(coeffs, mode === 'e' ? 'eval' : 'diff', x0));
    });
    return probs;
  }

  /* ================= 页面状态 ================= */
  const now = new Date();
  const key = dateKey(now);
  const dateLabel = now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
  document.getElementById('today').textContent = dateLabel;

  const LEVEL_KEY = 'daily-derivative:level';
  let level = 3;
  try {
    const saved = parseInt(localStorage.getItem(LEVEL_KEY) || '3', 10);
    if (saved >= 1 && saved <= 5) level = saved;
  } catch (e) {}

  let setLabel = '今日题目';
  let setSeed = hashStr('derivative|' + key + '|L' + level);
  let problems = buildSet(setSeed, level);
  let submitted = false;

  const list = document.getElementById('list');
  const scoreNum = document.getElementById('scoreNum');
  const scoreLabel = document.getElementById('scoreLabel');
  const bar = document.getElementById('bar');
  const levelText = document.getElementById('levelText');
  const levelDots = document.getElementById('levelDots');
  const setLabelEl = document.getElementById('setLabel');
  const submitBtn = document.getElementById('submitBtn');
  const resultPanel = document.getElementById('resultPanel');
  const scoreBig = document.getElementById('scoreBig');
  const resultMsg = document.getElementById('resultMsg');
  const toastEl = document.getElementById('toast');
  let toastTimer = null;

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1900);
  }
  function renderLevel(){
    levelText.textContent = 'Lv.' + level;
    Array.prototype.forEach.call(levelDots.children, function(el, i){
      el.classList.toggle('on', i < level);
    });
  }
  renderLevel();

  function render(){
    list.innerHTML = problems.map(function(p, i){
      return (
        '<article class="problem" data-index="' + i + '">' +
          '<div class="num">' + pad(i + 1) + '</div>' +
          '<div class="content">' +
            '<div class="type">' + p.type + '</div>' +
            '<div class="q">' + p.question + '</div>' +
            '<div class="input-row">' +
              '<input class="ans-input" data-i="' + i + '" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="' + p.placeholder + '" aria-label="第 ' + (i+1) + ' 题答案">' +
              '<div class="input-hint">' + p.hint + '</div>' +
            '</div>' +
            '<div class="feedback" hidden></div>' +
            '<div class="answer" hidden>' +
              '<div class="head">答案与解析</div>' +
              p.answer +
            '</div>' +
          '</div>' +
        '</article>'
      );
    }).join('');
    submitted = false;
    scoreNum.textContent = '—';
    scoreLabel.textContent = '提交后判分';
    bar.style.width = '0%';
    submitBtn.disabled = false;
    submitBtn.textContent = '提交答案并判分';
    resultPanel.hidden = true;
    setLabelEl.textContent = setLabel;
    Array.prototype.forEach.call(list.querySelectorAll('.ans-input'), function(inp){
      inp.addEventListener('keydown', function(e){
        if (e.key === 'Enter'){ e.preventDefault(); grade(); }
      });
    });
  }

  function checkAnswer(p, raw){
    if (!String(raw || '').trim()) return { ok: false, kind: 'empty' };
    if (p.check.kind === 'number'){
      const v = parseNumber(raw);
      if (v === null) return { ok: false, kind: 'format' };
      return v === p.check.value ? { ok: true } : { ok: false, kind: 'wrong' };
    }
    const parsed = parsePoly(raw);
    if (!parsed) return { ok: false, kind: 'format' };
    if (polyEquals(parsed, p.check.coeffs)) return { ok: true };
    return { ok: false, kind: 'wrong' };
  }

  function grade(){
    if (submitted) return;
    const inputs = Array.prototype.slice.call(list.querySelectorAll('.ans-input'));
    if (inputs.every(function(inp){ return !inp.value.trim(); })){
      toast('先写几道答案再提交吧');
      return;
    }
    let correct = 0;
    inputs.forEach(function(inp, i){
      const p = problems[i];
      const card = inp.closest('.problem');
      const fb = card.querySelector('.feedback');
      const ans = card.querySelector('.answer');
      const res = checkAnswer(p, inp.value);
      inp.disabled = true;
      ans.hidden = false;
      fb.hidden = false;
      card.classList.remove('correct', 'wrong');
      if (res.ok){
        correct++;
        card.classList.add('correct');
        fb.className = 'feedback ok';
        fb.textContent = '✓ 正确';
      } else {
        card.classList.add('wrong');
        fb.className = 'feedback bad';
        if (res.kind === 'empty') fb.textContent = '✗ 没有填写答案';
        else if (res.kind === 'format') fb.textContent = '✗ 格式无法识别，试试 6x^2-6x+5 这样的写法';
        else fb.textContent = '✗ 答案不对，看看下面的解析';
      }
    });

    submitted = true;
    submitBtn.disabled = true;
    submitBtn.textContent = '已提交本组';
    scoreNum.textContent = correct;
    scoreLabel.textContent = '本组答对';
    bar.style.width = (correct / 5 * 100) + '%';
    scoreBig.textContent = correct;
    resultPanel.hidden = false;

    const old = level;
    if (correct <= 2) level = Math.max(1, level - 1);
    else if (correct >= 4) level = Math.min(5, level + 1);
    if (level !== old){
      try { localStorage.setItem(LEVEL_KEY, String(level)); } catch (e) {}
    }
    renderLevel();

    let msg;
    if (correct <= 2){
      msg = level < old
        ? '错了 ' + (5 - correct) + ' 题，难度降到 <b>Lv.' + level + '</b>，先把基础打牢。'
        : '错了 ' + (5 - correct) + ' 题，已经是最低难度 <b>Lv.1</b>，慢慢来。';
    } else if (correct >= 4){
      msg = level > old
        ? '答对 ' + correct + ' 题，难度升到 <b>Lv.' + level + '</b>，试试更难的题。'
        : '答对 ' + correct + ' 题，已是最高难度 <b>Lv.5</b>，保持住！';
    } else {
      msg = '答对 ' + correct + ' 题，难度保持 <b>Lv.' + level + '</b>，继续加油。';
    }
    resultMsg.innerHTML = msg;
    resultPanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  submitBtn.addEventListener('click', grade);

  document.getElementById('nextBtn').addEventListener('click', function(){
    setLabel = '练习组';
    setSeed = ((Date.now() % 2147483647) ^ (level * 2654435761)) >>> 0;
    problems = buildSet(setSeed, level);
    render();
    list.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  document.getElementById('copyBtn').addEventListener('click', function(){
    const text = '每日求导 · ' + dateLabel + '\n\n' + problems.map(function(p, i){
      return (i + 1) + '. ' + p.plain;
    }).join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast('已复制 5 道题'); }, function(){ toast('复制失败，请手动选择'); });
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); toast('已复制 5 道题'); } catch (e) { toast('复制失败，请手动选择'); }
      document.body.removeChild(ta);
    }
  });

  document.getElementById('printBtn').addEventListener('click', function(){ window.print(); });

  const countdown = document.getElementById('countdown');
  function tick(){
    const n = new Date();
    const tomorrow = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1);
    let s = Math.max(0, Math.floor((tomorrow - n) / 1000));
    countdown.textContent = pad(Math.floor(s / 3600)) + ':' + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60);
    if (dateKey(n) !== key) location.reload();
  }
  tick();
  setInterval(tick, 1000);

  render();
})();
</script>
</body>
</html>
